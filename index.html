<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Book Club</title>
  <meta name="description" content="Track the books our club has read and score them on language and content.">
  <meta name="theme-color" content="#fafafa">
  <!-- Lets the app be added to an iPhone home screen and open like a real app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Book Club">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="36" height="36">
      <h1 id="clubName">Book Club</h1>
    </div>
    <div class="topbar-actions">
      <button id="memberBtn" class="chip" type="button" title="Change your name"></button>
      <button id="addBtn" class="btn primary" type="button">+ Add book</button>
    </div>
  </header>

  <main>
    <p id="modeNotice" class="notice" hidden></p>

    <section id="overview" class="overview" aria-label="Club overview" hidden></section>

    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="filter" type="search" placeholder="Find a book in our list…" aria-label="Find a book in our list">
      </div>
      <select id="sort" aria-label="Sort books">
        <option value="recent">Recently added</option>
        <option value="read">Recently read</option>
        <option value="overall">Best overall</option>
        <option value="language">Best language</option>
        <option value="content">Best content</option>
        <option value="title">Title A–Z</option>
      </select>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-art" aria-hidden="true">📚</div>
      <p class="empty-title">Your shelf is empty</p>
      <p>Add the first book your club has read — search for it online or type it in.</p>
      <button class="btn primary" type="button" data-action="add">+ Add your first book</button>
    </div>
  </main>

  <button class="btn primary fab" type="button" data-action="add" aria-label="Add book">+</button>

  <!-- Ask for the member's name -->
  <dialog id="nameDialog">
    <form method="dialog" id="nameForm" class="dialog-body">
      <h2>Who's reading?</h2>
      <p class="muted">Your name is shown next to the scores you give. It's saved on this device.</p>
      <label>Your name
        <input id="nameInput" required maxlength="40" autocomplete="given-name">
      </label>
      <div class="dialog-actions">
        <button class="btn primary" value="ok">Continue</button>
      </div>
    </form>
  </dialog>

  <!-- Book details + scoring -->
  <dialog id="bookDialog" class="wide">
    <div id="bookBody" class="dialog-body"></div>
  </dialog>

  <!-- Add / edit a book -->
  <dialog id="editDialog" class="wide">
    <div class="dialog-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="dialog-head">
        <h2 id="editTitle">Add a book</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">✕</button>
      </div>

      <section id="searchSection">
        <form id="searchForm" class="search-row">
          <input id="searchInput" type="search" placeholder="Search the internet: title, author or ISBN" aria-label="Search the internet for a book">
          <button class="btn" type="submit">Search</button>
        </form>
        <div id="searchResults" class="results"></div>
        <p class="divider"><span>or fill in the details yourself</span></p>
      </section>

      <form id="editForm" class="edit-form">
        <div class="cover-edit">
          <div id="coverPreview" class="cover big"></div>
          <label class="btn small">
            📷 Add photo
            <input id="coverFile" type="file" accept="image/*" hidden>
          </label>
          <button id="coverRemove" class="btn small ghost" type="button">Remove</button>
        </div>
        <div class="fields">
          <label>Title *
            <input id="fTitle" required maxlength="200">
          </label>
          <label>Author
            <input id="fAuthor" maxlength="200">
          </label>
          <div class="two">
            <label>Published
              <input id="fYear" type="number" min="0" max="2100" inputmode="numeric" placeholder="Year">
            </label>
            <label>We read it
              <input id="fReadOn" type="date">
            </label>
          </div>
          <label>About the book
            <textarea id="fDescription" rows="3" maxlength="4000" placeholder="Optional"></textarea>
          </label>
        </div>
        <div class="dialog-actions">
          <button class="btn ghost" type="button" data-close>Cancel</button>
          <button id="saveBook" class="btn primary" type="submit">Save book</button>
        </div>
      </form>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
